# Light Enchanted 3.0 Hybrid Renderer — Oculus / Iris shaderpack
# Portable baseline: OpenGL GLSL 1.20-compatible shader-pack pipeline.

profile.LOW=LE_PROFILE=0 LE_SHADOW_SAMPLES=1 LE_CONTACT_STEPS=0 LE_GTAO_SAMPLES=2 LE_VOLUMETRIC_QUALITY=0 LE_SSR_STEPS=0 shadowMapResolution=1024 shadowDistance=80
profile.BALANCED=LE_PROFILE=1 LE_SHADOW_SAMPLES=2 LE_CONTACT_STEPS=6 LE_GTAO_SAMPLES=6 LE_VOLUMETRIC_QUALITY=1 LE_SSR_STEPS=0 shadowMapResolution=2048 shadowDistance=128
profile.CINEMATIC=LE_PROFILE=2 LE_SHADOW_SAMPLES=3 LE_CONTACT_STEPS=12 LE_GTAO_SAMPLES=12 LE_VOLUMETRIC_QUALITY=2 LE_SSR_STEPS=12 shadowMapResolution=4096 shadowDistance=160

screen=<empty> <profile> <empty> [SHADOWS] [TRACING] [LOOK]
screen.columns=2
screen.SHADOWS=shadowMapResolution shadowDistance LE_SHADOW_SAMPLES LE_SHADOW_STRENGTH LE_SHADOW_BIAS LE_COLORED_SHADOWS
screen.TRACING=LE_CONTACT_STEPS LE_CONTACT_LENGTH LE_GTAO_SAMPLES LE_GTAO_RADIUS LE_VOLUMETRIC_QUALITY LE_SSR_STEPS LE_SSR_STRENGTH LE_EMITTER_BOOST
screen.LOOK=LE_EXPOSURE LE_CONTRAST LE_SATURATION LE_BLOOM_STRENGTH LE_VIGNETTE
screen.SHADOWS.columns=2
screen.TRACING.columns=2
screen.LOOK.columns=2

sliders=LE_SSR_STRENGTH LE_SHADOW_STRENGTH LE_SHADOW_BIAS LE_CONTACT_LENGTH LE_GTAO_RADIUS LE_EMITTER_BOOST LE_EXPOSURE LE_CONTRAST LE_SATURATION LE_BLOOM_STRENGTH LE_VIGNETTE shadowDistance shadowMapResolution

# Full world casters, including modded block entities, in the sun/moon shadow pass.
shadowMapResolution=2048
shadowDistance=128
shadowIntervalSize=4.0
shadow.culling=false
shadow.enabled=true
shadowPlayer=true
shadowEntities=true
shadowBlockEntities=true

# Light Enchanted uses the vanilla beacon path for its fallback beam; retain its depth information.
beacon.beam.depth=true
oldLighting=false
separateAo=true
vignette=false
underwaterOverlay=false
clouds=off
sun=false
moon=false

# Contact / AO result is written back into gcolor; depth textures remain available to the composite pass.

# Do not let optional translucent geometry turn into solid black shadow casters.
alphaTest.gbuffers_terrain=GREATER 0.10
alphaTest.gbuffers_entities=GREATER 0.10
alphaTest.gbuffers_textured=GREATER 0.10
alphaTest.gbuffers_weather=GREATER 0.10
alphaTest.gbuffers_water=GREATER 0.05
