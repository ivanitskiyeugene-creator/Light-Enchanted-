name: Publish 0-7-9 Versioned Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Build Mod workflow run containing the zero-seven-nine-jar artifact
        required: true
        type: string
      version:
        description: 0-7-9 version to publish (for example 2.8.0)
        required: true
        type: string
      target_commit:
        description: Commit SHA the release tag must point to
        required: true
        type: string
      title:
        description: Release title
        required: true
        type: string
      release_notes:
        description: Markdown release notes
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish dedicated 0-7-9 release
    runs-on: ubuntu-latest
    steps:
      - name: Download the validated 0-7-9 artifact
        uses: actions/download-artifact@v4
        with:
          name: zero-seven-nine-jar
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: release-asset

      - name: Create the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          tag="zero-seven-nine-v${VERSION}"
          asset="release-asset/zero_seven_nine-${VERSION}.jar"
          test -f "$asset"
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$tag" "$asset#zero_seven_nine-${VERSION}.jar" \
            --target "$TARGET_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md
