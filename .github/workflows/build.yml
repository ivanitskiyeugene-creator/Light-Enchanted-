name: Build Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build with Gradle
        shell: bash
        run: |
          gradle build --no-daemon --console=plain > build_output.txt 2>&1 || {
            echo "Gradle build failed — publishing error digest as an annotation"
            python3 .github/scripts/gradle_error_digest.py build_output.txt
            exit 1
          }

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lightenchanted-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload full build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-build-log
          path: build_output.txt

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
