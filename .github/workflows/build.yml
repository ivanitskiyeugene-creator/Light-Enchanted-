name: Build Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build with Gradle
        shell: bash
        run: |
          gradle build --no-daemon --console=plain --stacktrace > build_output.txt 2>&1 || {
            echo "Gradle build failed — publishing log tail as an annotation"
            tail -c 6000 build_output.txt | python3 -c "import sys,urllib.parse;print('::error title=Gradle build failed::'+urllib.parse.quote(sys.stdin.read()))"
            exit 1
          }

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lightenchanted-jar
          path: build/libs/*.jar
          if-no-files-found: error
