name: Build Mod

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_zero_seven_nine_release:
        description: Publish the built 0-7-9 JAR as its own named GitHub release
        required: false
        default: false
        type: boolean
      zero_seven_nine_release_title:
        description: Title for the dedicated 0-7-9 release
        required: false
        default: "0-7-9 versioned release"
        type: string
      zero_seven_nine_release_notes:
        description: Markdown notes for the dedicated 0-7-9 release
        required: false
        default: "Dedicated 0-7-9 release built and validated by GitHub Actions."
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Light Enchanted
        shell: bash
        run: |
          gradle build --no-daemon --console=plain > build_output.txt 2>&1 || {
            echo "Light Enchanted Gradle build failed — publishing error digest"
            python3 .github/scripts/gradle_error_digest.py build_output.txt
            exit 1
          }

      - name: Build Snow - SCPied
        shell: bash
        run: |
          cd snow-scpied
          gradle build --no-daemon --console=plain > ../snow_build_output.txt 2>&1 || {
            echo "Snow - SCPied Gradle build failed — publishing error digest"
            python3 ../.github/scripts/gradle_error_digest.py ../snow_build_output.txt
            exit 1
          }

      - name: Build 0-7-9
        shell: bash
        run: |
          cd 0-7-9
          gradle build --no-daemon --console=plain > ../zero_seven_nine_build_output.txt 2>&1 || {
            echo "0-7-9 Gradle build failed — publishing error digest"
            python3 ../.github/scripts/gradle_error_digest.py ../zero_seven_nine_build_output.txt
            exit 1
          }

      - name: "Build SECRET LAB: CUBED (SLC)"
        shell: bash
        run: |
          cd slc
          gradle build --no-daemon --console=plain > ../slc_build_output.txt 2>&1 || {
            echo "SLC Gradle build failed — publishing error digest"
            python3 ../.github/scripts/gradle_error_digest.py ../slc_build_output.txt
            exit 1
          }

      - name: Upload Light Enchanted jar
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lightenchanted-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload Light Enchanted shaderpack
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lightenchanted-shaderpack
          path: build/shaderpacks/*.zip
          if-no-files-found: error

      - name: Upload Snow - SCPied jar
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: snow-scpied-jar
          path: snow-scpied/build/libs/*.jar
          if-no-files-found: error

      - name: Upload 0-7-9 jar
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zero-seven-nine-jar
          path: 0-7-9/build/libs/*.jar
          if-no-files-found: error

      - name: Upload SLC jar
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: slc-jar
          path: slc/build/libs/*.jar
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest-build"
          name: "Latest Build"
          body: |
            Continuous build from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.
            
            ### Included Mod Jars:
            - **SECRET LAB - CUBED** (`slc-*.jar`) — Round engine, roles, CASSIE announcer and SCP-939 mimicry.
            - **0-7-9** (`zero_seven_nine-*.jar`) — SCP-079 surveillance AI gameplay mod and CCTV shaders.
            - **Snow - SCPied** (`snow_scpied-*.jar`) — Dynamic snow accumulation and physical footprints/blood.
            - **Light Enchanted** (`lightenchanted-*.jar`) — configurable emitters and fallback beam renderer.
            - **Light Enchanted Hybrid Renderer** (`lightenchanted-shaders-*.zip`) — optional Oculus GPU shadows, screen-space tracing and scalable presets.
          draft: false
          prerelease: false
          files: |
            build/libs/*.jar
            build/shaderpacks/*.zip
            snow-scpied/build/libs/*.jar
            0-7-9/build/libs/*.jar
            slc/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-zero-seven-nine-release:
    name: Publish dedicated 0-7-9 release
    needs: build
    if: >-
      needs.build.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_zero_seven_nine_release) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-079]')))
    runs-on: ubuntu-latest
    steps:
      - name: Download the validated 0-7-9 artifact
        uses: actions/download-artifact@v4
        with:
          name: zero-seven-nine-jar
          path: release-asset

      - name: Derive release metadata from the JAR
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail
          asset="$(find release-asset -maxdepth 1 -type f -name 'zero_seven_nine-*.jar' -print -quit)"
          test -n "$asset"
          filename="$(basename "$asset")"
          version="${filename#zero_seven_nine-}"
          version="${version%.jar}"
          test -n "$version"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the versioned 0-7-9 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zero-seven-nine-v${{ steps.release_metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.zero_seven_nine_release_title || format('0-7-9 v{0}', steps.release_metadata.outputs.version) }}
          body: |
            Dedicated 0-7-9 release built and validated by GitHub Actions from commit `${{ github.sha }}`.

            ${{ inputs.zero_seven_nine_release_notes || 'This release contains only the validated 0-7-9 JAR.' }}
          draft: false
          prerelease: false
          files: ${{ steps.release_metadata.outputs.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
